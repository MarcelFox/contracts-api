services:
  contracts_api:
    container_name: contracts-api
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "main.py"]
    volumes:
      - .:/app
    working_dir: /app
    env_file:
      - .env
    ports:
      - "${APP_PORT}:${APP_PORT}"
    networks:
          - shared_network

networks:
  shared_network:
    external: true
