services:
  contracts_api:
    container_name: contracts-api
    build:
      context: .
      dockerfile: Dockerfile
    command:
      [
        "uvicorn",
        "src.main:app",
        "--reload",
        "--host",
        "${APP_HOST}",
        "--port",
        "${APP_PORT}",
      ]
    volumes:
      - .:/app
    working_dir: /app
    env_file:
      - .env
    ports:
      - "${APP_PORT}:${APP_PORT}"
    networks:
      - shared_network
    depends_on:
      - postgres

  postgres:
    container_name: postgres
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: contracts_db
    ports:
      - "5432:5432"
    networks:
      - shared_network

networks:
  shared_network:
    external: true
